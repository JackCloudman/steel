name: LSP Audit Harness

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  run-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and run audit
        run: python audit/automated/run_audit.py

      - name: Upload Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: |
            audit/automated/logs/REPORT_STEEL_LSP_AUDIT.md
            audit/automated/logs/incoming.jsonl
            audit/automated/logs/outgoing.jsonl
            audit/automated/logs/server.stderr.log
            audit/automated/logs/run.log